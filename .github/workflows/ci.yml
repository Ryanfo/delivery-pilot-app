name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:unit
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { PORT: "4173" }
  # On pull_request, GitHub runs CI on a temporary merge of the PR head into the base. This
  # publishes exactly which merge commit and base were tested, so the delivery coordinator can
  # verify the association instead of assuming checks ran on the PR head alone.
  provenance:
    name: integration-provenance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit, build, e2e]
    permissions:
      statuses: write
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Publish tested merge provenance
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base=$(git rev-parse HEAD^1)
          head=$(git rev-parse HEAD^2)
          test "$head" = "$HEAD_SHA"
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=success -f context=delivery/integration-provenance \
            -f description="tested=${GITHUB_SHA} base=${base}"
